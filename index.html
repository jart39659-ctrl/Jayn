<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LoCAlZer</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#101116">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LoCAlZer">
<style>
  * { box-sizing: border-box; }

  :root {
    --bg-page: #101116;
    --bg-glow1: rgba(79,157,255,0.08);
    --bg-glow2: rgba(61,220,99,0.06);
    --text-primary: #e8e9ee;
    --text-secondary: #9a9eae;
    --text-muted: #7d8194;
    --header-bg: rgba(17,18,24,0.9);
    --border-color: #24252f;
    --border-strong: #2f313f;
    --panel-bg: #15161d;
    --toolbar-bg: #191a22;
    --editor-bg: #121319;
    --editor-text: #c7cbe0;
    --placeholder-color: #4a4d60;
    --caret-color: #fff;
    --btn-bg: #1c1d27;
    --btn-bg-hover: #262836;
    --btn-text: #d6d8e2;
    --accent-blue: #4f9dff;
    --accent-blue-strong: #3b82f0;
    --accent-green: #3ddc63;
    --accent-yellow: #ffd633;
    --scrollbar-thumb: #2c2d3a;
    --hl-money-bg: rgba(61,220,99,0.22);
    --hl-money-text: #6dffa0;
    --hl-money-ring: rgba(61,220,99,0.35);
    --hl-click-bg: rgba(255,214,51,0.28);
    --hl-click-text: #ffe790;
    --hl-click-ring: rgba(255,214,51,0.55);
    --minimize-dur: 320ms;
    --editor-font-size: 12.5px;
  }

  [data-theme="slate"] {
    --bg-page: #16171a;
    --bg-glow1: rgba(255,255,255,0.03);
    --bg-glow2: rgba(255,255,255,0.02);
    --text-primary: #e6e6e8;
    --text-secondary: #9a9a9e;
    --text-muted: #7a7a7e;
    --header-bg: rgba(20,21,24,0.9);
    --border-color: #28292c;
    --border-strong: #34353a;
    --panel-bg: #1b1c20;
    --toolbar-bg: #1f2024;
    --editor-bg: #17181b;
    --editor-text: #d6d6da;
    --btn-bg: #212226;
    --btn-bg-hover: #2a2b30;
    --btn-text: #dcdce0;
    --accent-blue: #7c8cff;
    --accent-blue-strong: #6674f0;
    --accent-green: #59d98a;
    --accent-yellow: #ffcf5c;
    --scrollbar-thumb: #303136;
  }

  [data-theme="forest"] {
    --bg-page: #0f1712;
    --bg-glow1: rgba(61,220,99,0.10);
    --bg-glow2: rgba(79,200,157,0.06);
    --text-primary: #e6f2ea;
    --text-secondary: #97ab9f;
    --text-muted: #74886f;
    --header-bg: rgba(15,22,17,0.9);
    --border-color: #223028;
    --border-strong: #2c4034;
    --panel-bg: #131e17;
    --toolbar-bg: #17241c;
    --editor-bg: #101a13;
    --editor-text: #cfe6d7;
    --btn-bg: #182319;
    --btn-bg-hover: #203024;
    --btn-text: #d8ecdd;
    --accent-blue: #4fdba0;
    --accent-blue-strong: #37c78c;
    --accent-green: #7dff9e;
    --accent-yellow: #ffe066;
    --scrollbar-thumb: #263a2c;
  }

  [data-theme="light"] {
    --bg-page: #f4f5f8;
    --bg-glow1: rgba(79,157,255,0.06);
    --bg-glow2: rgba(61,220,99,0.05);
    --text-primary: #1b1c22;
    --text-secondary: #565968;
    --text-muted: #7a7d8a;
    --header-bg: rgba(255,255,255,0.92);
    --border-color: #dcdee6;
    --border-strong: #c7cad4;
    --panel-bg: #ffffff;
    --toolbar-bg: #f1f2f6;
    --editor-bg: #fafbfd;
    --editor-text: #2a2c34;
    --placeholder-color: #a3a7b3;
    --caret-color: #1b1c22;
    --btn-bg: #eef0f4;
    --btn-bg-hover: #e2e5eb;
    --btn-text: #2a2c34;
    --accent-blue: #2f6fe0;
    --accent-blue-strong: #255bc4;
    --accent-green: #1f9d4c;
    --accent-yellow: #b98900;
    --scrollbar-thumb: #d4d7de;
    --hl-money-bg: rgba(31,157,76,0.15);
    --hl-money-text: #147a37;
    --hl-money-ring: rgba(31,157,76,0.4);
    --hl-click-bg: rgba(185,137,0,0.18);
    --hl-click-text: #7a5900;
    --hl-click-ring: rgba(185,137,0,0.45);
  }

  html, body {
    margin: 0;
    height: 100%;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    background: var(--bg-page);
    background-image: radial-gradient(circle at 15% -10%, var(--bg-glow1), transparent 40%),
                       radial-gradient(circle at 100% 0%, var(--bg-glow2), transparent 35%);
    color: var(--text-primary);
    height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
    transition: background 200ms ease, color 200ms ease;
  }

  /* ---------- Header ---------- */
  header {
    padding: 12px 20px;
    background: var(--header-bg);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    border-bottom: 1px solid var(--border-color);
    box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    z-index: 5;
    flex-wrap: wrap;
    transition: background 200ms ease, border-color 200ms ease;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand .dot {
    width: 22px;
    height: 22px;
    border-radius: 7px;
    background: linear-gradient(135deg, #4f9dff, #3ddc63);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.08), 0 2px 8px rgba(79,157,255,0.35);
    flex-shrink: 0;
  }
  header h1 {
    font-size: 17px;
    margin: 0;
    letter-spacing: 0.3px;
    font-weight: 700;
    color: var(--text-primary);
  }

  .btns {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .btns .divider {
    width: 1px;
    height: 22px;
    background: var(--border-strong);
    margin: 0 2px;
  }

  /* ---------- Toggle switches ---------- */
  .switch {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    color: var(--text-secondary);
    cursor: pointer;
    user-select: none;
    font-weight: 600;
  }
  .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
  .switch .track {
    position: relative;
    width: 32px;
    height: 18px;
    border-radius: 999px;
    background: var(--btn-bg);
    border: 1px solid var(--border-strong);
    transition: background 180ms ease, border-color 180ms ease;
    flex-shrink: 0;
  }
  .switch .track::after {
    content: '';
    position: absolute;
    top: 1px;
    left: 1px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #babed0;
    transition: transform 180ms ease, background 180ms ease;
  }
  .switch input:checked + .track { background: color-mix(in srgb, var(--accent-green) 25%, var(--btn-bg)); border-color: var(--accent-green); }
  .switch input:checked + .track::after { transform: translateX(14px); background: var(--accent-green); }
  .switch.locate input:checked + .track { background: color-mix(in srgb, var(--accent-yellow) 25%, var(--btn-bg)); border-color: var(--accent-yellow); }
  .switch.locate input:checked + .track::after { background: var(--accent-yellow); }
  .switch:hover .track { border-color: var(--text-muted); }

  /* ---------- Buttons ---------- */
  .btn {
    appearance: none;
    border: 1px solid var(--border-strong);
    background: var(--btn-bg);
    color: var(--btn-text);
    padding: 7px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 150ms ease, border-color 150ms ease, transform 100ms ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn:hover { background: var(--btn-bg-hover); border-color: var(--text-muted); }
  .btn:active { transform: scale(0.96); }
  .btn:focus-visible { outline: 2px solid var(--accent-blue); outline-offset: 2px; }

  .btn-primary {
    background: linear-gradient(135deg, var(--accent-blue), var(--accent-blue-strong));
    border-color: transparent;
    color: #fff;
    box-shadow: 0 2px 10px rgba(79,157,255,0.35);
  }
  .btn-primary:hover { filter: brightness(1.08); }

  /* ---------- Settings dropdown ---------- */
  .settingsWrap { position: relative; }
  .settingsPanel {
    position: fixed;
    width: 250px;
    max-width: calc(100vw - 16px);
    background: var(--panel-bg);
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.4);
    padding: 14px;
    z-index: 30;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .settingsPanel[hidden] { display: none; }
  .settingsRow { display: flex; flex-direction: column; gap: 6px; }
  .settingsRow .rowLabel {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-secondary);
    display: flex;
    justify-content: space-between;
  }
  .settingsRow .rowLabel span.val { color: var(--text-muted); font-weight: 500; }
  .settingsRow select {
    width: 100%;
    background: var(--btn-bg);
    color: var(--btn-text);
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 13px;
  }
  .settingsRow input[type="range"] {
    width: 100%;
    accent-color: var(--accent-blue);
  }
  .settingsDivider { height: 1px; background: var(--border-color); margin: 2px 0; }
  .settingsReset {
    font-size: 12px;
    padding: 7px 12px;
    justify-content: center;
  }

  /* ---------- Layout ---------- */
  main {
    flex: 1;
    display: flex;
    min-height: 0;
    gap: 12px;
    padding: 12px;
  }
  #editorPane, #outputPane {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    background: var(--panel-bg);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    transition: flex-grow var(--minimize-dur) ease, opacity var(--minimize-dur) ease,
                margin var(--minimize-dur) ease, padding var(--minimize-dur) ease,
                background 200ms ease, border-color 200ms ease;
    opacity: 1;
  }
  main.output-only #editorPane {
    flex-grow: 0;
    width: 0;
    margin: 0;
    padding: 0;
    border-width: 0;
    opacity: 0;
    pointer-events: none;
  }

  .paneLabel {
    padding: 9px 14px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
    background: var(--toolbar-bg);
    border-bottom: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-weight: 700;
    transition: background 200ms ease, border-color 200ms ease;
  }
  .legend {
    text-transform: none;
    letter-spacing: normal;
    font-size: 11px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 12px;
    font-weight: 500;
  }
  .legend .item { display: flex; align-items: center; gap: 5px; }
  .legend .swatch {
    width: 9px; height: 9px; border-radius: 2px;
    display: inline-block;
  }
  .legend .swatch.money { background: var(--accent-green); }
  .legend .swatch.click { background: var(--accent-yellow); }

  .editorWrap {
    position: relative;
    flex: 1;
    overflow: hidden;
  }
  #highlightPre, #codeInput {
    position: absolute;
    inset: 0;
    margin: 0;
    padding: 16px;
    font-family: "SF Mono", ui-monospace, Consolas, Menlo, monospace;
    font-size: var(--editor-font-size);
    line-height: 1.6;
    white-space: pre-wrap;
    word-wrap: break-word;
    overflow: auto;
    border: none;
  }
  #highlightPre {
    color: var(--editor-text);
    background: var(--editor-bg);
    pointer-events: none;
    transition: background 200ms ease, color 200ms ease;
  }
  #highlightPre code { font-family: inherit; }
  .hl-money {
    background: var(--hl-money-bg);
    color: var(--hl-money-text);
    border-radius: 3px;
    box-shadow: 0 0 0 1px var(--hl-money-ring);
  }
  .hl-click {
    background: var(--hl-click-bg);
    color: var(--hl-click-text);
    border-radius: 3px;
    box-shadow: 0 0 0 1px var(--hl-click-ring);
  }
  #codeInput {
    background: transparent !important;
    color: transparent;
    caret-color: var(--caret-color);
    resize: none;
    outline: none;
    -webkit-appearance: none;
    appearance: none;
    border-radius: 0;
  }
  #codeInput::placeholder { color: var(--placeholder-color); }

  #outputPane iframe {
    flex: 1;
    width: 100%;
    border: none;
    background: #fff;
  }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { filter: brightness(1.3); }

  @media (max-width: 700px) {
    main { flex-direction: column; padding: 10px; gap: 10px; }
    header { padding: 10px 14px; }
    .btns { gap: 8px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="dot"></span>
    <h1>LoCAlZer</h1>
  </div>
  <div class="btns">
    <label class="switch">
      <input type="checkbox" id="highlightToggle" checked>
      <span class="track"></span>
      <span>Highlight</span>
    </label>
    <label class="switch locate">
      <input type="checkbox" id="locateToggle">
      <span class="track"></span>
      <span>Locate clicks</span>
    </label>
    <span class="divider"></span>
    <button class="btn" id="minimizeBtn">Minimize ▸</button>
    <button class="btn" id="fileBtn">Open File</button>
    <input type="file" id="fileInput" accept=".html,.htm,text/html" hidden>
    <button class="btn" id="clearBtn">Clear</button>

    <div class="settingsWrap">
      <button class="btn" id="settingsBtn">⚙ Settings</button>
      <div id="settingsPanel" class="settingsPanel" hidden>
        <div class="settingsRow">
          <span class="rowLabel">Theme</span>
          <select id="themeSelect">
            <option value="midnight">Midnight</option>
            <option value="slate">Slate</option>
            <option value="forest">Forest</option>
            <option value="light">Light</option>
          </select>
        </div>
        <div class="settingsRow">
          <span class="rowLabel">Minimize speed <span class="val" id="speedValue">320ms</span></span>
          <input type="range" id="speedRange" min="0" max="800" step="20" value="320">
        </div>
        <div class="settingsRow">
          <span class="rowLabel">Editor font size</span>
          <select id="fontSizeSelect">
            <option value="11">Small</option>
            <option value="12.5">Medium</option>
            <option value="15">Large</option>
          </select>
        </div>
        <div class="settingsDivider"></div>
        <button class="btn settingsReset" id="resetSettingsBtn">Reset to defaults</button>
      </div>
    </div>

    <button class="btn btn-primary" id="runBtn">Run ▶</button>
  </div>
</header>

<main>
  <div id="editorPane">
    <div class="paneLabel">
      <span>Paste HTML</span>
      <span class="legend">
        <span class="item"><span class="swatch money"></span>state / currency</span>
        <span class="item"><span class="swatch click"></span>last clicked</span>
      </span>
    </div>
    <div class="editorWrap">
      <pre id="highlightPre"><code id="highlightCode"></code></pre>
      <textarea id="codeInput" placeholder="<!DOCTYPE html>&#10;<html>&#10;  ...&#10;</html>" spellcheck="false"></textarea>
    </div>
  </div>
  <div id="outputPane">
    <div class="paneLabel">Output</div>
    <iframe id="outputFrame" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-same-origin"></iframe>
  </div>
</main>

<script>
  const codeInput = document.getElementById('codeInput');
  const highlightPre = document.getElementById('highlightPre');
  const highlightCode = document.getElementById('highlightCode');
  const outputFrame = document.getElementById('outputFrame');
  const runBtn = document.getElementById('runBtn');
  const clearBtn = document.getElementById('clearBtn');
  const highlightToggle = document.getElementById('highlightToggle');
  const locateToggle = document.getElementById('locateToggle');
  const minimizeBtn = document.getElementById('minimizeBtn');
  const fileBtn = document.getElementById('fileBtn');
  const fileInput = document.getElementById('fileInput');
  const mainEl = document.querySelector('main');

  const settingsBtn = document.getElementById('settingsBtn');
  const settingsPanel = document.getElementById('settingsPanel');
  const themeSelect = document.getElementById('themeSelect');
  const speedRange = document.getElementById('speedRange');
  const speedValue = document.getElementById('speedValue');
  const fontSizeSelect = document.getElementById('fontSizeSelect');
  const resetSettingsBtn = document.getElementById('resetSettingsBtn');

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function escapeRegExp(s) {
    return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  /* ======================= Money / currency detection ======================= */

  const MONEY_WORDS = new Set([
    'coin', 'coins', 'money', 'currency', 'cash', 'balance', 'credit', 'credits',
    'gold', 'gem', 'gems', 'point', 'points', 'score', 'xp', 'wallet', 'funds',
    'earnings', 'revenue', 'totalearned', 'prestige', 'prestigepoints',
    'clickpower', 'bank', 'wealth', 'treasure', 'diamond', 'diamonds', 'token', 'tokens'
  ]);

  function splitIdentifierWords(name) {
    return name
      .replace(/([a-z0-9])([A-Z])/g, '$1 $2')
      .replace(/[-_$]+/g, ' ')
      .toLowerCase()
      .split(/\s+/)
      .filter(Boolean);
  }

  function isMoneyIdentifier(name) {
    const lower = name.toLowerCase();
    if (MONEY_WORDS.has(lower)) return true;
    return splitIdentifierWords(name).some((w) => MONEY_WORDS.has(w));
  }

  // Scans declarations, object-literal properties, and member-expression
  // writes (obj.prop = / += / ++ ...) for identifiers that look like a
  // currency/score/state value, using whole-word matching so things like
  // "appointment" never falsely match "point".
  function computeMoneyNames(src) {
    const names = new Set();

    const declRe = /\b(?:let|const|var)\s+([A-Za-z_$][\w$]*)\s*=/g;
    let m;
    while ((m = declRe.exec(src))) if (isMoneyIdentifier(m[1])) names.add(m[1]);

    const propRe = /\b([A-Za-z_$][\w$]*)\s*:\s*[^,\n{}]+[,}]/g;
    while ((m = propRe.exec(src))) if (isMoneyIdentifier(m[1])) names.add(m[1]);

    const memberRe = /\.([A-Za-z_$][\w$]*)\b\s*(?:\+\+|--|\+=|-=|\*=|\/=|=(?!=))/g;
    while ((m = memberRe.exec(src))) if (isMoneyIdentifier(m[1])) names.add(m[1]);

    return names;
  }

  function highlightMoneyInChunk(text, names) {
    let esc = escapeHtml(text);
    if (names.size === 0) return esc;
    const wrap = (full) => `<span class="hl-money">${full}</span>`;

    esc = esc.replace(
      /\b(let|const|var)\s+([A-Za-z_$][\w$]*)\s*=\s*[^;\n]*;/g,
      (full, kw, name) => (names.has(name) ? wrap(full) : full)
    );

    esc = esc.replace(
      /\b([A-Za-z_$][\w$]*)\s*:\s*[^,\n{}]+[,}]/g,
      (full, name) => (names.has(name) && !full.includes('hl-money') ? wrap(full) : full)
    );

    names.forEach((name) => {
      const safe = escapeRegExp(name);

      const incRe = new RegExp(`\\b(?:[\\w$]+\\.)?${safe}\\s*(?:\\+\\+|--|\\+=|-=|\\*=|/=)`, 'g');
      esc = esc.replace(incRe, (full) => (full.includes('hl-money') ? full : wrap(full)));

      const selfRe = new RegExp(`\\b(?:[\\w$]+\\.)?${safe}\\s*=\\s*[^;\\n<]*\\b${safe}\\b[^;\\n<]*;`, 'g');
      esc = esc.replace(selfRe, (full) => (full.includes('hl-money') ? full : wrap(full)));

      const displayRe = new RegExp(`\\.(?:textContent|innerText|innerHTML)\\s*=\\s*[^;\\n]*\\b${safe}\\b[^;\\n]*;`, 'g');
      esc = esc.replace(displayRe, (full) => (full.includes('hl-money') ? full : wrap(full)));
    });

    return esc;
  }

  function buildHighlightedHtml(src, clickRange) {
    const names = computeMoneyNames(src);
    const renderChunk = (text) =>
      highlightToggle.checked ? highlightMoneyInChunk(text, names) : escapeHtml(text);

    if (!clickRange) return renderChunk(src);

    const before = src.slice(0, clickRange.start);
    const target = src.slice(clickRange.start, clickRange.end);
    const after = src.slice(clickRange.end);
    return renderChunk(before) + '<span class="hl-click">' + renderChunk(target) + '</span>' + renderChunk(after);
  }

  let currentClickRange = null;

  function updateHighlight() {
    highlightCode.innerHTML = buildHighlightedHtml(codeInput.value, currentClickRange) + '\n';
  }

  /* ======================= Locate clicks ======================= */

  function locateInSource(info) {
    const src = codeInput.value;
    let idx = -1;
    if (info.id) {
      idx = src.indexOf('id="' + info.id + '"');
      if (idx === -1) idx = src.indexOf("id='" + info.id + "'");
    }
    if (idx === -1 && info.text) {
      idx = src.indexOf(info.text);
    }
    if (idx === -1) return;

    let lineStart = src.lastIndexOf('\n', idx) + 1;
    let lineEnd = src.indexOf('\n', idx);
    if (lineEnd === -1) lineEnd = src.length;

    currentClickRange = { start: lineStart, end: lineEnd };
    updateHighlight();

    requestAnimationFrame(() => {
      const el = highlightCode.querySelector('.hl-click');
      if (el && el.scrollIntoView) el.scrollIntoView({ block: 'center' });
    });
  }

  window.addEventListener('message', (e) => {
    const data = e.data;
    if (!locateToggle.checked) return;
    if (!data || !data.__lz_locate) return;
    locateInSource(data.info);
  });

  locateToggle.addEventListener('change', () => {
    if (!locateToggle.checked) {
      currentClickRange = null;
      updateHighlight();
    }
  });

  const LOCATE_SCRIPT = `
<script>
(function(){
  function describe(el){
    if(!el || el.nodeType !== 1) return null;
    var id = el.id || '';
    var text = (el.textContent || '').trim().slice(0,60);
    return { id: id, text: text };
  }
  document.addEventListener('pointerdown', function(e){
    var el = e.target, depth = 0;
    while(el && depth < 6){
      var info = describe(el);
      if(info && (info.id || info.text)){
        try{ window.parent.postMessage({ __lz_locate:true, info:info }, '*'); }catch(err){}
        break;
      }
      el = el.parentElement;
      depth++;
    }
  }, true);
})();
<\/script>`;

  function withLocate(html) {
    if (/<\/body>/i.test(html)) return html.replace(/<\/body>/i, LOCATE_SCRIPT + '\n</body>');
    return html + LOCATE_SCRIPT;
  }

  /* ======================= Settings ======================= */

  const DEFAULT_SETTINGS = { theme: 'midnight', minimizeDur: 320, fontSize: 12.5 };
  const SETTINGS_KEY = 'locazer_settings';

  function loadSettings() {
    try {
      const raw = JSON.parse(localStorage.getItem(SETTINGS_KEY));
      if (raw && typeof raw === 'object') return Object.assign({}, DEFAULT_SETTINGS, raw);
    } catch (e) { /* ignore corrupt / unavailable storage */ }
    return Object.assign({}, DEFAULT_SETTINGS);
  }

  function saveSettings() {
    try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch (e) { /* ignore */ }
  }

  function applySettings(s) {
    document.documentElement.setAttribute('data-theme', s.theme);
    document.documentElement.style.setProperty('--minimize-dur', s.minimizeDur + 'ms');
    document.documentElement.style.setProperty('--editor-font-size', s.fontSize + 'px');
    themeSelect.value = s.theme;
    speedRange.value = String(s.minimizeDur);
    speedValue.textContent = s.minimizeDur + 'ms';
    fontSizeSelect.value = String(s.fontSize);
  }

  let settings = loadSettings();
  applySettings(settings);

  themeSelect.addEventListener('change', () => {
    settings.theme = themeSelect.value;
    applySettings(settings);
    saveSettings();
  });

  speedRange.addEventListener('input', () => {
    settings.minimizeDur = Number(speedRange.value);
    applySettings(settings);
    saveSettings();
  });

  fontSizeSelect.addEventListener('change', () => {
    settings.fontSize = Number(fontSizeSelect.value);
    applySettings(settings);
    saveSettings();
  });

  resetSettingsBtn.addEventListener('click', () => {
    settings = Object.assign({}, DEFAULT_SETTINGS);
    applySettings(settings);
    saveSettings();
  });

  function positionSettingsPanel() {
    const margin = 8;
    const btnRect = settingsBtn.getBoundingClientRect();
    const panelWidth = settingsPanel.offsetWidth || 250;

    let left = btnRect.right - panelWidth; // default: align panel's right edge to button's right edge
    left = Math.max(margin, Math.min(left, window.innerWidth - panelWidth - margin));

    let top = btnRect.bottom + margin;
    top = Math.min(top, window.innerHeight - margin); // keep it from spawning below the viewport

    settingsPanel.style.left = left + 'px';
    settingsPanel.style.top = top + 'px';
  }

  function openSettings() {
    settingsPanel.hidden = false;
    positionSettingsPanel();
  }
  function closeSettings() { settingsPanel.hidden = true; }

  settingsBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    settingsPanel.hidden ? openSettings() : closeSettings();
  });
  document.addEventListener('click', (e) => {
    if (!settingsPanel.hidden && !settingsPanel.contains(e.target) && e.target !== settingsBtn) {
      closeSettings();
    }
  });
  window.addEventListener('resize', () => {
    if (!settingsPanel.hidden) positionSettingsPanel();
  });

  /* ======================= Wiring ======================= */

  function syncScroll() {
    highlightPre.scrollTop = codeInput.scrollTop;
    highlightPre.scrollLeft = codeInput.scrollLeft;
  }

  function run() {
    outputFrame.srcdoc = withLocate(codeInput.value);
  }

  codeInput.addEventListener('input', () => {
    currentClickRange = null;
    updateHighlight();
  });
  codeInput.addEventListener('scroll', syncScroll);
  highlightToggle.addEventListener('change', updateHighlight);

  minimizeBtn.addEventListener('click', () => {
    const collapsing = !mainEl.classList.contains('output-only');
    mainEl.classList.toggle('output-only', collapsing);
    minimizeBtn.textContent = collapsing ? 'Show Editor ◂' : 'Minimize ▸';
  });

  fileBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => {
    const file = fileInput.files && fileInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      codeInput.value = String(reader.result);
      currentClickRange = null;
      updateHighlight();
    };
    reader.readAsText(file);
    fileInput.value = '';
  });

  runBtn.addEventListener('click', run);
  clearBtn.addEventListener('click', () => {
    codeInput.value = '';
    outputFrame.srcdoc = '';
    currentClickRange = null;
    updateHighlight();
    codeInput.focus();
  });

  codeInput.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      run();
    }
  });

  updateHighlight();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch((err) => {
        console.warn('Service worker registration failed:', err);
      });
    });
  }
</script>

</body>
</html>
